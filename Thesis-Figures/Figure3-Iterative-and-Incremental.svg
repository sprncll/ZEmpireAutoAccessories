<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="780" viewBox="0 0 1720 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arR" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#b3353c"/>
    </marker>
    <marker id="arG" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1720" height="780" fill="#ffffff"/>

  <!-- ================= panel (a) : the phases, repeated ================= -->
  <text x="60" y="52" font-size="19" font-weight="bold" fill="#1a1a1a">(a)  Phases repeated in every increment</text>
  <line x1="60" y1="68" x2="650" y2="68" stroke="#d4d4d4" stroke-width="1.2"/>

  <g>
    <rect x="215" y="112" width="330" height="66" rx="5" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="380" y="152" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Requirements</text>

    <line x1="380" y1="178" x2="380" y2="208" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ar)"/>

    <rect x="215" y="212" width="330" height="66" rx="5" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="380" y="252" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Design</text>

    <line x1="380" y1="278" x2="380" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ar)"/>

    <rect x="215" y="312" width="330" height="66" rx="5" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="380" y="352" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Implementation</text>

    <line x1="380" y1="378" x2="380" y2="408" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ar)"/>

    <rect x="215" y="412" width="330" height="66" rx="5" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="380" y="452" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Testing</text>

    <line x1="380" y1="478" x2="380" y2="508" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ar)"/>

    <rect x="215" y="512" width="330" height="66" rx="5" fill="#e8eaed" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="380" y="545" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Review with the</text>
    <text x="380" y="567" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">shop owner</text>
  </g>

  <!-- feedback: a defect or a changed rule sends work back -->
  <path d="M 215,545 L 150,545 L 150,145 L 211,145"
        fill="none" stroke="#b3353c" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#arR)"/>
  <text x="138" y="345" font-size="15" fill="#b3353c" font-weight="bold"
        text-anchor="middle" transform="rotate(-90 138 345)">a defect or a changed rule returns work to an earlier phase</text>

  <path d="M 545,445 L 610,445 L 610,245 L 549,245"
        fill="none" stroke="#b3353c" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#arR)"/>
  <text x="628" y="345" font-size="15" fill="#b3353c" font-weight="bold"
        text-anchor="middle" transform="rotate(90 628 345)">testing feeds back into design</text>

  <rect x="60" y="625" width="590" height="92" rx="5" fill="#fbfbfc" stroke="#d4d4d4" stroke-width="1.2"/>
  <text x="78" y="655" font-size="15.5" fill="#333333">This is the ITERATIVE half: the same phases are run again</text>
  <text x="78" y="679" font-size="15.5" fill="#333333">whenever something is found to be wrong or incomplete,</text>
  <text x="78" y="703" font-size="15.5" fill="#333333">rather than once and only once.</text>

  <!-- ================= panel (b) : the increments ================= -->
  <text x="740" y="52" font-size="19" font-weight="bold" fill="#1a1a1a">(b)  Increments delivered over the project</text>
  <line x1="740" y1="68" x2="1660" y2="68" stroke="#d4d4d4" stroke-width="1.2"/>

  <!-- time axis -->
  <line x1="762" y1="104" x2="762" y2="614" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="748" y="360" font-size="15" fill="#6b7280" font-weight="bold" text-anchor="middle"
        transform="rotate(-90 748 360)">Time</text>

  <g font-size="16.5" fill="#1a1a1a">
    <rect x="778" y="110" width="300" height="54" rx="4" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="794" y="136" font-weight="bold">1  Foundation</text>
    <text x="794" y="155" font-size="14" fill="#555555">20–28 Aug</text>

    <rect x="778" y="180" width="390" height="54" rx="4" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="794" y="206" font-weight="bold">2  Core records</text>
    <text x="794" y="225" font-size="14" fill="#555555">1–7 Sep</text>

    <rect x="778" y="250" width="480" height="54" rx="4" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="794" y="276" font-weight="bold">3  Catalogue and usability</text>
    <text x="794" y="295" font-size="14" fill="#555555">11–15 Sep</text>

    <rect x="778" y="320" width="570" height="54" rx="4" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="794" y="346" font-weight="bold">4  Hardening and cashiering</text>
    <text x="794" y="365" font-size="14" fill="#555555">20–22 Sep</text>

    <rect x="778" y="390" width="660" height="54" rx="4" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="794" y="416" font-weight="bold">5  Measurement and inventory</text>
    <text x="794" y="435" font-size="14" fill="#555555">23–28 Sep</text>

    <rect x="778" y="460" width="750" height="54" rx="4" fill="#eceef1" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="794" y="486" font-weight="bold">6  Payments, reporting and shop rules</text>
    <text x="794" y="505" font-size="14" fill="#555555">29 Sep – 1 Oct</text>

    <rect x="778" y="530" width="840" height="54" rx="4" fill="#dfe2e6" stroke="#1a1a1a" stroke-width="1.8"/>
    <text x="794" y="556" font-weight="bold">7  Shade tracking and the interface</text>
    <text x="794" y="575" font-size="14" fill="#555555">7–10 Oct</text>
  </g>

  <text x="1198" y="612" font-size="15.5" font-weight="bold" fill="#6b7280" text-anchor="middle">
    each increment is a working system, wider than the one before
  </text>

  <rect x="740" y="625" width="920" height="92" rx="5" fill="#fbfbfc" stroke="#d4d4d4" stroke-width="1.2"/>
  <text x="758" y="655" font-size="15.5" fill="#333333">This is the INCREMENTAL half: the system was not delivered all at once. Each increment</text>
  <text x="758" y="679" font-size="15.5" fill="#333333">was usable before the next was begun, and later increments revisited earlier ones — 74% of</text>
  <text x="758" y="703" font-size="15.5" fill="#333333">source files were returned to in a later increment, and 49% in three or more.</text>
</svg>
